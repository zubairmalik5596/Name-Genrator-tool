<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Name Generator</title>
<style>
body { margin:0; overflow:hidden; background:#111; font-family:Arial, sans-serif; }
#header { position:absolute; top:20px; left:50%; transform:translateX(-50%);
  font-size:24px; color:#fff; font-weight:bold; z-index:2; text-align:center;}
#controls { position:absolute; bottom:50px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:2;}
input[type=text] {
    padding:12px 25px;
    font-size:18px;
    border-radius:12px;
    border:2px solid #ff4c80;
    outline:none;
    box-shadow:0 0 15px rgba(255,76,128,0.7);
    background:rgba(0,0,0,0.3);
    color:white;
    transition:0.3s;
}
input[type=text]:focus { border-color:#ffcc00; box-shadow:0 0 20px #ffcc00; }
button { padding:12px 25px; font-size:16px; border:none; border-radius:10px; cursor:pointer; font-weight:bold;
  background:linear-gradient(45deg,#ff4c80,#ffcc00); color:white; box-shadow:0 0 10px #ff4c80,0 0 20px #ffcc00; transition:0.3s;}
button:hover { transform:scale(1.05); box-shadow:0 0 20px #ff4c80,0 0 40px #ffcc00;}
canvas { position:absolute; top:0; left:0; }

#pngBtn { position:absolute; right:20px; bottom:20px; z-index:3; }

#modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; display:none; z-index:5; }
#modalContent { background:#222; color:#fff; padding:30px 50px; border-radius:20px; font-size:22px; text-align:center; box-shadow:0 0 20px #ff4c80; }
#modalContent button { margin-top:20px; }
</style>
</head>
<body>

<div id="header">This tool is designed by Zubair Malik</div>

<div id="controls">
<input type="text" id="userNameInput" placeholder="Enter your name">
<button id="startBtn">Make Heart 💖</button>
</div>

<button id="pngBtn">Download PNG 💾</button>

<canvas id="canvas"></canvas>

<div id="modal">
<div id="modalContent">
Thanks for using services of Zubi!<br>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
let CENTER = { x: width/2, y: height/2 };

let animationStarted=false;
let userName="ZUBI";

const startBtn=document.getElementById('startBtn');
const userNameInput=document.getElementById('userNameInput');
const pngBtn=document.getElementById('pngBtn');
const modal=document.getElementById('modal');

pngBtn.style.display='none';

startBtn.addEventListener('click',()=>{
    let nameVal=userNameInput.value.trim();
    if(nameVal.length>0) userName=nameVal.toUpperCase();
    animationStarted=true;
    startBtn.style.display='none';
    userNameInput.style.display='none';
    pngBtn.style.display='inline-block';
});

// Heart outline points
function heartOutlinePoints(scale=15, steps=300){
    let points=[];
    for(let i=0;i<steps;i++){
        let t=i/steps*2*Math.PI;
        let x=16*Math.sin(t)**3;
        let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        points.push({x:CENTER.x + x*scale, y:CENTER.y - y*scale});
    }
    return points;
}

// Particle class
class Particle{
    constructor(x,y){
        this.baseX=x; this.baseY=y;
        this.x=CENTER.x; this.y=CENTER.y;
        this.size=Math.random()*2+1.2;
        this.color=`hsl(${Math.random()*360},100%,60%)`;
        this.vx=(Math.random()-0.5)*10; this.vy=(Math.random()-0.5)*10;
        this.phase=Math.random()*100; this.reform=false;
    }
    update(){
        if(this.reform){
            let dx=this.baseX-this.x; let dy=this.baseY-this.y;
            this.x+=dx*0.05; this.y+=dy*0.05;
            this.size=Math.sin(frame*0.1+this.phase)*1.5+2;
        } else { this.x+=this.vx*0.3; this.y+=this.vy*0.3; }
    }
    draw(){
        ctx.fillStyle=this.color; ctx.shadowColor=this.color; ctx.shadowBlur=15;
        ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
    }
}

// Sparks
class Spark{
    constructor(){ this.reset(); }
    reset(){ this.x=Math.random()*width; this.y=Math.random()*height; this.vx=(Math.random()-0.5)*2; this.vy=(Math.random()-0.5)*2;
        this.life=Math.random()*120+60; this.size=Math.random()*2+1; this.color=`hsl(${Math.random()*360},80%,70%)`; }
    update(){ this.x+=this.vx; this.y+=this.vy; this.life--; if(this.life<=0)this.reset(); }
    draw(){ ctx.fillStyle=this.color; ctx.shadowColor=this.color; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
}

let sparks=[]; for(let i=0;i<200;i++) sparks.push(new Spark());
let heartPoints=heartOutlinePoints();
let heartParticles=heartPoints.map(p=>{ let pt=new Particle(p.x,p.y); pt.reform=true; return pt; });
let nameParticles=[]; let frame=0; let heartFormed=false;

// Generate name particles with wrapping
function generateNameParticles(){
    const tempCanvas=document.createElement('canvas');
    const tempCtx=tempCanvas.getContext('2d');
    tempCanvas.width=width; tempCanvas.height=height;

    let maxWidth = 300; // Heart width limit
    let fontSize=80;
    tempCtx.font=`${fontSize}px Arial Black`;
    tempCtx.textAlign='center'; tempCtx.textBaseline='middle';
    
    let words = userName.split(" ");
    let lines = [];
    let currentLine = "";
    for(let w of words){
        let testLine = currentLine.length>0 ? currentLine+" "+w : w;
        if(tempCtx.measureText(testLine).width>maxWidth){
            lines.push(currentLine); currentLine=w;
        } else currentLine = testLine;
    }
    if(currentLine) lines.push(currentLine);

    // Adjust font size if too many lines
    while(lines.length*fontSize > 200){
        fontSize -=5;
        tempCtx.font=`${fontSize}px Arial Black`;
    }

    lines.forEach((line,i)=>{
        tempCtx.fillText(line, CENTER.x, CENTER.y - (lines.length-1)*fontSize/2 + i*fontSize);
    });

    const imgData=tempCtx.getImageData(0,0,width,height);
    nameParticles=[];
    for(let y=0;y<height;y+=6){
        for(let x=0;x<width;x+=6){
            let idx=(y*width+x)*4;
            if(imgData.data[idx+3]>128){
                let p=new Particle(x,y); p.reform=false; nameParticles.push(p);
            }
        }
    }
}

// Animate
function animate(){
    ctx.clearRect(0,0,width,height);
    if(animationStarted){
        ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(0,0,width,height);

        let allNearBase=true;
        for(let p of heartParticles){ p.update(); p.draw();
            if(Math.abs(p.x-p.baseX)>0.5 || Math.abs(p.y-p.baseY)>0.5) allNearBase=false;
        }

        if(allNearBase && !heartFormed){ heartFormed=true; generateNameParticles(); nameParticles.forEach(p=> p.reform=true); }
        if(heartFormed){ nameParticles.forEach(p=>{ p.update(); p.draw(); }); }

        sparks.forEach(s=>{ s.update(); s.draw(); });
        frame++;
    }
    requestAnimationFrame(animate);
}

// PNG download with watermark
pngBtn.addEventListener('click',()=>{
    const tempCanvas=document.createElement('canvas');
    tempCanvas.width=width; tempCanvas.height=height;
    const tempCtx=tempCanvas.getContext('2d');
    tempCtx.fillStyle='black'; tempCtx.fillRect(0,0,width,height);

    heartParticles.forEach(p=>{ tempCtx.fillStyle=p.color; tempCtx.shadowColor=p.color; tempCtx.shadowBlur=15; tempCtx.beginPath(); tempCtx.arc(p.x,p.y,p.size,0,Math.PI*2); tempCtx.fill(); });
    if(heartFormed) nameParticles.forEach(p=>{ tempCtx.fillStyle=p.color; tempCtx.shadowColor=p.color; tempCtx.shadowBlur=15; tempCtx.beginPath(); tempCtx.arc(p.x,p.y,p.size,0,Math.PI*2); tempCtx.fill(); });

    // watermark
    tempCtx.font="24px Arial"; tempCtx.fillStyle="white"; tempCtx.fillText("Generated by Zubi", 20, 30);

    const link=document.createElement('a');
    link.href=tempCanvas.toDataURL("image/png");
    link.download="heart.png";
    link.click();
    showModal();
});

// Modal
function showModal(){ modal.style.display='flex'; }
function closeModal(){ modal.style.display='none'; }

window.addEventListener('resize',()=>{
    width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight;
    CENTER={x:width/2, y:height/2};
    heartPoints=heartOutlinePoints();
    heartParticles=heartPoints.map(p=>{ let pt=new Particle(p.x,p.y); pt.reform=true; return pt; });
    if(heartFormed) generateNameParticles();
});

animate();
  // Input field me Enter press hone par start button ka function chalaye
userNameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){  // Enter press hua
        startBtn.click();    // Button ka click simulate kare
    }
});

</script>
</body>
</html>
